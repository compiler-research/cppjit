name: Nightly

# The full test matrix on a schedule; applying the test-nightly label
# runs it on a PR (re-apply the label for a fresh run).

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test-nightly') }}
    name: ${{ matrix.os }}/llvm${{ matrix.llvm }}/py${{ matrix.py }}/c++${{ matrix.cxx }}${{ matrix.vg && '/vg' || '' }}${{ matrix.flavor == 'cling' && '/cling' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Breadth beyond the PR matrix (C++17, LLVM 22, arm) and one cling
        # cell. valgrind runs on LLVM 23 (x86 and arm) against the vendored
        # clang23 suppressions under .github/valgrind/. The LLVM 22 cells carry
        # the older-major breadth.
        include:
          - { os: ubuntu-24.04,     llvm: '22', flavor: system, py: '3.12', cxx: '17' }
          - { os: ubuntu-24.04,     llvm: '23', flavor: '',     py: '3.14', cxx: '23' }
          - { os: ubuntu-24.04,     llvm: '23', flavor: '',     py: '3.13', cxx: '20', vg: true }
          - { os: ubuntu-24.04,     llvm: '23', flavor: '',     py: '3.14', cxx: '20', vg: true }
          - { os: ubuntu-24.04,     llvm: '23', flavor: '',     py: '3.14', cxx: '20' }
          - { os: ubuntu-24.04,     llvm: '23', flavor: '',     py: '3.12', cxx: '20', vg: true }
          - { os: ubuntu-24.04-arm, llvm: '23', flavor: '',     py: '3.13', cxx: '20', vg: true }
          - { os: ubuntu-24.04-arm, llvm: '22', flavor: system, py: '3.12', cxx: '17' }
          - { os: macos-26,         llvm: '23', flavor: system, py: '3.12', cxx: '20' }
          - { os: macos-26,         llvm: '23', flavor: system, py: '3.14', cxx: '23' }
          - { os: macos-26-intel,   llvm: '22', flavor: system, py: '3.12', cxx: '20' }
          # cling backend, against the cached llvm-root (cling-llvm22) recipe cell.
          - { os: ubuntu-24.04,     llvm: '22', flavor: cling,  flavor_version: cling-llvm22, py: '3.13', cxx: '20' }
    uses: compiler-research/ci-workflows/.github/workflows/cppjit.yml@main
    with:
      # To track CppInterOp drift, add a cell with cppinterop-ref: main;
      # red on it means the fork re-sync is due.
      # The reusable's cppjit-ref defaults to main; pin the triggering commit.
      cppjit-repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      cppjit-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      os: ${{ matrix.os }}
      llvm-version: ${{ matrix.llvm }}
      llvm-flavor: ${{ matrix.flavor }}
      llvm-flavor-version: ${{ matrix.flavor_version || '' }}
      python-version: ${{ matrix.py }}
      cxx-standard: ${{ matrix.cxx }}
      valgrind: ${{ matrix.vg || false }}
      run-xfail-crashing-tests: true

  drift-issue:
    needs: build-test
    if: ${{ always() && needs.build-test.result == 'failure' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- cppjit-nightly-drift -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Nightly build/test failed',
              '',
              `The scheduled nightly run failed (CppJIT \`main\`, pinned CppInterOp).`,
              `Investigate the failing cell; a persistent failure may mean a fork re-sync is due.`,
              '',
              `Run: ${run}`,
              `Date: ${new Date().toISOString()}`,
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'nightly-drift',
            });
            const hit = existing.find(i => (i.body || '').startsWith(marker));
            if (hit) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Nightly: CppJIT build/test failing',
                labels: ['nightly-drift'],
                body,
              });
            }
